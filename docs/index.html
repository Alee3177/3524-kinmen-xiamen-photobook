<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3524小組・金門廈門之旅</title>
<style>
:root{--ink:#111;--bg:#f4f4f1;--card:#fff;--line:#d8d8d2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#f2f2f2;--bg:#18181a;--card:#222226;--line:#3a3a40}}
:root[data-theme="dark"]{--ink:#f2f2f2;--bg:#18181a;--card:#222226;--line:#3a3a40}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}
header{position:sticky;top:0;z-index:2;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header h1{font-size:16px;margin:0;flex:1 1 auto}
select{max-width:45vw}
select,button,.dl{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);text-decoration:none;cursor:pointer}
main{padding:16px;display:flex;flex-direction:column;align-items:stretch;gap:12px;min-width:0}
#stage{width:100%;max-width:900px;min-width:0;overflow:auto;text-align:center;margin:0 auto}
#stage img{width:100%;height:auto;display:block;margin:0 auto;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15);cursor:zoom-in}
#stage.zoomed img{width:160%;max-width:none;cursor:zoom-out}
nav.pager{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
#pinfo{font-size:14px;min-width:120px;text-align:center}
.hint{font-size:12px;opacity:.7;text-align:center}
@media (max-width:480px){header h1{font-size:14px} select,button,.dl{font-size:13px}}
</style></head>
<body>
<header>
  <h1>3524小組・金門廈門之旅</h1>
  <select id="chapters" aria-label="章節導覽"></select>
  <a class="dl" href="3524小組_金門廈門之旅.pdf" download>下載 PDF</a>
</header>
<main>
  <div id="stage"><img id="page" alt="" src="pages/page_001.jpg?v=r8"></div>
  <nav class="pager">
    <button id="prev" aria-label="上一頁">← 上一頁</button>
    <span id="pinfo"></span>
    <button id="next" aria-label="下一頁">下一頁 →</button>
  </nav>
  <div class="hint">點圖片可放大或還原；也可用左右鍵或滑動翻頁。</div>
</main>
<script>
const TOTAL=158;
const CHAPTERS=[{"title": "出發與交通", "page": 2}, {"title": "同行合影（一）", "page": 6}, {"title": "同行合影（二）", "page": 23}, {"title": "同行合影（三）", "page": 40}, {"title": "街巷建築（一）", "page": 55}, {"title": "街巷建築（二）", "page": 72}, {"title": "自然風光", "page": 86}, {"title": "植物園與山林（一）", "page": 101}, {"title": "植物園與山林（二）", "page": 118}, {"title": "夜景", "page": 125}, {"title": "餐桌回憶", "page": 137}, {"title": "旅途細節", "page": 152}];
let cur=1;
const img=document.getElementById('page'), stage=document.getElementById('stage');
const sel=document.getElementById('chapters'), info=document.getElementById('pinfo');
function label(p){return p===1?'封面':'第 '+p+' 頁 / 共 '+TOTAL+' 頁';}
function show(p){
  if(p<1||p>TOTAL) return;
  cur=p; img.src='pages/page_'+String(p).padStart(3,'0')+'.jpg?v=r8';
  img.alt=label(p); info.textContent=label(p);
  stage.classList.remove('zoomed'); stage.scrollTop=0; stage.scrollLeft=0;
  try{localStorage.setItem('bookPage',String(p));}catch(e){}
  window.scrollTo({top:0,behavior:'instant'});
}
const opt0=document.createElement('option'); opt0.textContent='章節導覽'; opt0.value=''; sel.appendChild(opt0);
sel.appendChild(Object.assign(document.createElement('option'),{textContent:'封面',value:'1'}));
CHAPTERS.forEach(c=>sel.appendChild(Object.assign(document.createElement('option'),{textContent:c.title,value:String(c.page)})));
sel.onchange=()=>{if(sel.value) show(parseInt(sel.value,10));};
document.getElementById('prev').onclick=()=>show(cur-1);
document.getElementById('next').onclick=()=>show(cur+1);
img.onclick=()=>{stage.classList.toggle('zoomed'); img.style.cursor=stage.classList.contains('zoomed')?'zoom-out':'zoom-in';};
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')show(cur-1); if(e.key==='ArrowRight')show(cur+1);});
let tx=null;
stage.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
stage.addEventListener('touchend',e=>{if(tx===null||stage.classList.contains('zoomed'))return; const dx=e.changedTouches[0].clientX-tx; if(Math.abs(dx)>50) show(cur+(dx<0?1:-1)); tx=null;});
let start=1; try{start=parseInt(localStorage.getItem('bookPage')||'1',10)||1;}catch(e){}
show(start);
</script>
</body></html>
